<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Connection Lost | Finflo</title>
    <style>
      :root {
        --background: #020617;
        --foreground: #f8fafc;
        --muted: #0f172a;
        --muted-foreground: #94a3b8;
        --border: #1e293b;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--background);
        color: var(--foreground);
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Glow Effects */
      .glow-top {
        position: absolute;
        top: -15%;
        left: -10%;
        width: 70vw;
        height: 70vw;
        border-radius: 50%;
        background-color: rgba(59, 130, 246, 0.1);
        filter: blur(100px);
        pointer-events: none;
      }
      .glow-bottom {
        position: absolute;
        bottom: -15%;
        right: -10%;
        width: 70vw;
        height: 70vw;
        border-radius: 50%;
        background-color: rgba(16, 185, 129, 0.08);
        filter: blur(100px);
        pointer-events: none;
      }

      .container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
        max-width: 400px;
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .icon-container {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .icon {
        width: 32px;
        height: 32px;
        color: var(--primary);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--muted-foreground);
        margin-bottom: 2.5rem;
      }

      button {
        background: linear-gradient(135deg, var(--primary), var(--primary-hover));
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 16px;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        width: 100%;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      }

      button:active {
        transform: scale(0.96);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: var(--muted-foreground);
        min-height: 1.2em;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>

    <div class="container">
      <div class="icon-container">
        <!-- Wifi Off SVG -->
        <svg
          class="icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 2 22 22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.82" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
        </svg>
      </div>

      <h1>Connection Lost</h1>
      <p>
        Finflo requires an active network connection to securely synchronize your financial data. Please check your internet and try again.
      </p>

      <button id="retryBtn" onclick="retryConnection()">Try Again</button>
      <div class="status" id="status"></div>
    </div>

    <script>
      // Read the retry URL from the query parameter passed by native Android code.
      // The native MainActivity reads capacitor.config.json (which is flavor-specific)
      // and passes the correct server URL (with ?app_mode=member for member APK).
      var params = new URLSearchParams(window.location.search);
      var retryUrl = params.get('retry_url') || 'https://app.finflo.org';

      function retryConnection() {
        var btn = document.getElementById('retryBtn');
        var status = document.getElementById('status');

        if (!navigator.onLine) {
          status.textContent = 'Still offline. Please check your connection.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Connecting...';
        status.textContent = '';

        // Test actual connectivity before navigating (prevents another error flash)
        fetch(retryUrl, { mode: 'no-cors', cache: 'no-store' })
          .then(function() {
            window.location.replace(retryUrl);
          })
          .catch(function() {
            btn.disabled = false;
            btn.textContent = 'Try Again';
            status.textContent = 'Connection failed. Please try again.';
          });
      }

      // Auto-retry when network comes back online
      window.addEventListener('online', function() {
        document.getElementById('status').textContent = 'Connection detected! Reconnecting...';
        setTimeout(retryConnection, 1000);
      });
    </script>
  </body>
</html>
