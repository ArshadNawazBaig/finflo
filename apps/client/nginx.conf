# Redirect www to non-www (301 permanent) — critical for SEO indexing
server {
    listen 80;
    server_name www.finflo.org;
    return 301 https://finflo.org$request_uri;
}

server {
    listen 80;
    server_name finflo.org _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # `always` ensures the headers are emitted for all responses including
    # 4xx/5xx. TLS is terminated by the upstream proxy/CDN; HSTS still works
    # because browsers honour it on HTTPS responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    # Conservative CSP — script-src is locked down to self + the third-party
    # SDKs the app actually loads. Tighten further once inline styles are
    # eliminated.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com https://accounts.google.com wss:; frame-src 'self' https://js.stripe.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Fallback: redirect www via Host header check (covers edge cases)
    if ($host = 'www.finflo.org') {
        return 301 https://finflo.org$request_uri;
    }

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Serve APK/IPA files as direct downloads (must come before SPA fallback)
    location ~* \.(apk|ipa)$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$uri"';
        try_files $uri =404;
    }

    # Route requests to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend server
    location /api/ {
        proxy_pass http://server:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSocket connections for Socket.io
    location /socket.io/ {
        proxy_pass http://server:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Proxy uploaded files
    location /uploads/ {
        proxy_pass http://server:5001/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy APK downloads to backend
    location /downloads/ {
        proxy_pass http://server:5001/downloads/;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Prevent caching for Service Worker and Manifest
    location ~* (sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
