name: CI Pipeline

# Gates every change before it reaches an environment.
#   PRs into `staging`  → must pass before merging to test
#   PRs into `main`     → must pass before merging to production
#   Pushes to either    → re-verify (Railway performs the actual deploy from
#                         these branches via its native GitHub integration).
on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (workspaces)
        run: npm install

      # ── Client ────────────────────────────────────────────────────────────
      # Non-blocking for now: the client has a large backlog of existing lint
      # errors. This surfaces them in the run without failing the gate. Once the
      # backlog is cleared, remove `continue-on-error` to make lint blocking.
      - name: Lint Frontend (non-blocking)
        continue-on-error: true
        run: npm run lint --workspace=apps/client

      - name: Build Frontend
        run: npm run build --workspace=apps/client
        env:
          # CI build is a verification gate only; the real per-environment
          # VITE_API_URL is injected by Railway at deploy time. Falls back to a
          # placeholder so the build never fails on a missing secret.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ci-build-placeholder.invalid' }}

      # ── Server ────────────────────────────────────────────────────────────
      - name: Verify Backend (syntax check)
        run: |
          cd apps/server
          npm run build
          # Byte-compile every source file to catch syntax errors before deploy.
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "Backend syntax verification passed."

  ci-passed:
    name: CI Passed
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "All checks passed. Railway will deploy this branch to its mapped environment."
